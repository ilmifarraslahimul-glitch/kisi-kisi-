<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Update server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#0a1240; --cyan:#00bcd4; --signal:#ffa400;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:350%;margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Times New Roman",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;place-items:center;overflow:hidden;
}
.stage{display:flex;flex-direction:column;align-items:center;gap:40px;padding:24px}

/* circular loader */
.loader{position:relative;width:min(240px,62vw);aspect-ratio:1}
.loader svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spin{transform-origin:100px 100px;transform-box:view-box}
.r1{animation:cw 14s linear infinite}
.r2{animation:cw 1.8s cubic-bezier(.5,.1,.5,.9) infinite}
.r3{animation:ccw 2.6s linear infinite}
.r4{animation:cw 1.2s linear infinite}
.orbit{animation:cw 3.2s linear infinite}
.orbit.b{animation-duration:4.4s;animation-direction:reverse}
@keyframes cw{to{transform:rotate(360deg)}}
@keyframes ccw{to{transform:rotate(-360deg)}}
.core{transform-origin:100px 100px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(.75);opacity:.7}50%{transform:scale(1.1);opacity:1}}
.pulse{transform-origin:100px 100px;animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.loader{animation:float 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* title */
h1{margin:0;font-weight:800;font-size:clamp(34px,8vw,56px);letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline}
h1 span.l{display:inline-block;animation:wave 2.4s ease-in-out infinite;animation-delay:calc(var(--n)*.07s)}
@keyframes wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.dots{display:inline-flex;gap:5px;margin-left:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--signal);animation:pop 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pop{0%,60%,100%{transform:scale(.5);opacity:.5}30%{transform:scale(1.2);opacity:1}}

.track{width:min(280px,70vw);height:6px;border-radius:3px;background:rgba(10,18,64,.08);overflow:hidden;margin-top:-14px}
.track::after{content:"";display:block;height:100%;width:40%;border-radius:3px;background:var(--cyan);animation:slide 1.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:8s!important}
  .loader,h1 .l{animation:none!important}
}
</style>
</head>
<body>
<main class="stage" role="status" aria-live="polite" aria-label="zuliardi berjalan">
  <div class="loader" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none">
      <!-- outer dashed ring -->
      <g class="spin r1"><circle cx="100" cy="100" r="94" stroke="#00bcd4" stroke-opacity=".7" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/></g>
      <!-- main yellow arc -->
      <circle cx="100" cy="100" r="80" stroke="#0a1240" stroke-opacity=".07" stroke-width="10"/>
      <g class="spin r2"><circle cx="100" cy="100" r="80" stroke="#ffa400" stroke-width="10" stroke-linecap="round" stroke-dasharray="150 353"/></g>
      <!-- middle counter ring -->
      <g class="spin r3"><circle cx="100" cy="100" r="62" stroke="#00bcd4" stroke-width="4" stroke-linecap="round" stroke-dasharray="40 30 8 30"/></g>
      <!-- inner mint arc -->
      <g class="spin r4"><circle cx="100" cy="100" r="46" stroke="#00c98d" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 220"/></g>
      <!-- orbiting dots -->
      <g class="spin orbit"><circle cx="100" cy="6" r="5" fill="#00bcd4"/></g>
      <g class="spin orbit b"><circle cx="100" cy="38" r="3.5" fill="#ffa400"/></g>
      <!-- core -->
      <circle class="pulse" cx="100" cy="100" r="26" stroke="#ffa400" stroke-width="2"/>
      <circle class="core" cx="100" cy="100" r="18" fill="#ffa400"/>
    </svg>
  </div>
  <h1 id="t" aria-label="Update server"></h1>
  <div class="track" aria-hidden="true"></div>
</main>
<script>
(function(){
  var h=document.getElementById('t'),s='Update server',n=0;
  s.split('').forEach(function(c){
    var e=document.createElement('span');
    if(c===' '){e.innerHTML='&nbsp;';e.style.width='.28em';e.style.display='inline-block';}
    else{e.className='l';e.textContent=c;e.style.setProperty('--n',n++);}
    h.appendChild(e);
  });
  var d=document.createElement('span');d.className='dots';d.innerHTML='<i></i><i></i><i></i>';h.appendChild(d);
})();
</script>
</body>
</html>
